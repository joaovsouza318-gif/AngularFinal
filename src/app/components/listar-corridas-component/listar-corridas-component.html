<section class="lista-corridas">
  <h1>Corridas cadastradas</h1>

  @if (corridas().length === 0) {
    <p class="mensagem-vazia">Nenhuma corrida cadastrada até o momento.</p>
  } @else {
    <div class="tabela-responsiva">
      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Data</th>
            <th>Modalidade</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody>
          @for (corrida of corridas(); track corrida.idCorrida) {
            <tr>
              <td>{{ corrida.descricao }}</td>
              <td>{{ corrida.data | date: 'dd/MM/yyyy' }}</td>
              <td>{{ corrida.niveis }} Km</td>
              <td><button type="button" (click)="removerCorrida(corrida.idCorrida)">Remover</button></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
