<div id="div-form">
  <form id="form-atleta" (ngSubmit)="salvarAtleta()">

    <h2>{{ modoEdicao ? 'Editar Atleta' : 'Cadastrar Atleta' }}</h2>

    <label for="nome">Nome: </label>
    <input type="text" id="nome" name="nome" class="input01" required placeholder="Informe seu nome..." [(ngModel)]="nome">

    <label for="cpf">CPF: </label>
    <input type="text" id="cpf" name="cpf" class="input02" required maxlength="11" placeholder="Informe seu CPF..." [(ngModel)]="cpf">

    <label>Sexo: </label>
    <div class="grupo-radios">
      <label class="radio-opcao" for="sexoM">
        <input type="radio" id="sexoM" name="sexo" class="btnSelect" value="M" [(ngModel)]="sexo"> Masculino
      </label>
      <label class="radio-opcao" for="sexoF">
        <input type="radio" id="sexoF" name="sexo" class="btnSelect" value="F" [(ngModel)]="sexo"> Feminino
      </label>
      <label class="radio-opcao" for="sexoN">
        <input type="radio" id="sexoN" name="sexo" class="btnSelect" value="N" [(ngModel)]="sexo"> Não Informado
      </label>
    </div>

    <label for="dataNascimento">Data de nascimento: </label>
    <input type="date" id="dataNascimento" name="dataNascimento" required [(ngModel)]="dataNascimento">

    <label for="peso">Peso (kg): </label>
    <input type="number" id="peso" name="peso" class="input01" min="1" step="0.1" required placeholder="Ex: 72.5" [(ngModel)]="peso">

    <label for="altura">Altura (m): </label>
    <input type="number" id="altura" name="altura" class="input01" min="0.5" max="2.8" step="0.01" required placeholder="Ex: 1.75" [(ngModel)]="altura">

    <label for="cep">CEP</label>
    <input type="text" name="cep" id="cep" class="input01" [(ngModel)]="cep" >

    <label for="rua">Rua/Logradouro: </label>
    <input type="text" id="rua" name="rua" class="input02" required placeholder="Informe sua Rua/Logradouro..." [(ngModel)]="rua">

    <label for="bairro">Bairro: </label>
    <input type="text" id="bairro" name="bairro" class="input02" required placeholder="Informe seu Bairro..." [(ngModel)]="bairro">

    <label for="cidade">Cidade: </label>
    <input type="text" id="cidade" name="cidade" class="input02" required placeholder="Informe sua Cidade..." [(ngModel)]="cidade">

    <label for="uf">UF: </label>
    <input type="text" id="uf" name="uf" class="input02" required placeholder="Informe seu Estado/UF..." [(ngModel)]="uf">

    <div id="div-btns">
      <button type="submit" id="btnAdd">{{ modoEdicao ? 'Atualizar Atleta' : 'Cadastrar Atleta' }}</button>
      @if (modoEdicao) {
        <button type="button" id="btnCancelar" (click)="cancelarEdicao()">Cancelar</button>
      } @else {
        <button type="button" id="btnLimpar" (click)="limparFormulario()">Limpar Dados</button>
      }
    </div>
  </form>
</div>
