<div id="div-form">
  <form id="form-corrida" (ngSubmit)="salvarCorrida()">

    <h2 id="titulo-form">{{ modoEdicao ? 'Editar Corrida' : 'Cadastrar Corrida' }}</h2>

    <label for="descricao">Descrição: </label>
    <input type="text" id="descricao" name="descricao" class="input01" required placeholder="Ex: Maratona da Meia-noite..." [(ngModel)]="descricao">

    <label for="data">Data: </label>
    <input type="date" id="data" name="data" class="input01" required [(ngModel)]="data">

    <fieldset class="grupo-modalidades">
      <legend>Modalidades disponíveis</legend>

      @for (modalidade of modalidadesDisponiveis; track modalidade) {
        <label>
          <input
            type="checkbox"
            [checked]="modalidadeSelecionada(modalidade)"
            (change)="alternarModalidade(modalidade, $any($event.target).checked)"
          >
          {{ modalidade }} Km
        </label>
      }
    </fieldset>

    <div id="div-btns">
      <button
        type="submit"
        id="btnAdd"
        [disabled]="modalidadesSelecionadas.length === 0"
      >
        {{ modoEdicao ? 'Atualizar Corrida' : 'Cadastrar Corrida' }}
      </button>
      @if (modoEdicao) {
        <button type="button" id="btnCancelar" (click)="cancelarEdicao()">Cancelar</button>
      } @else {
        <button type="button" id="btnLimpar" (click)="limparFormulario()">Limpar Dados</button>
      }
    </div>
  </form>
</div>
