<div id="div-form">
  <form id="form-atleta">

    <label for="nome">Nome: </label>
    <input type="text" id="nome" name="nome" class="input01" required placeholder="Informe seu nome...">

    <label for="cpf">CPF: </label>
    <input type="text" id="cpf" name="cpf" class="input02" required maxlength="11" placeholder="Informe seu nome...">

    <label for="sexo">Sexo: </label>
    <input type="radio" id="sexoM" name="sexo" class="btnSelect" value="M"> Masculino
    <input type="radio" id="sexoF" name="sexo" class="btnSelect" value="F"> Feminino
    <input type="radio" id="sexoN" name="sexo" class="btnSelect" value="N"> Não Informado

    <label for="cep">CEP</label>
    <input type="text" name="cep" id="cep" class="input01">

    <label for="rua">Rua/Logradouro: </label>
    <input type="text" id="rua" name="rua" class="input02" required placeholder="Informe sua Rua/Logradouro...">

    <label for="bairro">Bairro: </label>
    <input type="text" id="bairro" name="bairro" class="input02" required placeholder="Informe seu Bairro...">

    <label for="cidade">Cidade: </label>
    <input type="text" id="cidade" name="cidade" class="input02" required placeholder="Informe sua Cidade...">

    <label for="nome">UF: </label>
    <input type="text" id="nome" name="nome" class="input01" required placeholder="Informe seu Estado/UF...">

    <div id="div-btns">
      <button type="submit" id="btnAdd"> Cadastrar Atleta </button>
      <button type="reset" id="btnLimpar"> Cadastrar Atleta </button>
    </div>
  </form>
</div>
