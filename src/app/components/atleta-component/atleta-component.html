<div id="div-form">
  <form id="form-atleta" (ngSubmit)="salvarAtleta()">

    <label for="nome">Nome: </label>
    <input type="text" id="nome" name="nome" class="input01" required placeholder="Informe seu nome..." [(ngModel)]="nome">

    <label for="cpf">CPF: </label>
    <input type="text" id="cpf" name="cpf" class="input02" required maxlength="11" placeholder="Informe seu nome..." [(ngModel)]="cpf">

    <label for="sexo">Sexo: </label>
    <input type="radio" id="sexoM" name="sexo" class="btnSelect" value="M" [(ngModel)]="sexo"> Masculino
    <input type="radio" id="sexoF" name="sexo" class="btnSelect" value="F" [(ngModel)]="sexo"> Feminino
    <input type="radio" id="sexoN" name="sexo" class="btnSelect" value="N" [(ngModel)]="sexo"> Não Informado

    <label for="cep">CEP</label>
    <input type="text" name="cep" id="cep" class="input01" [(ngModel)]="cep" >

    <label for="rua">Rua/Logradouro: </label>
    <input type="text" id="rua" name="rua" class="input02" required placeholder="Informe sua Rua/Logradouro..." [(ngModel)]="rua">

    <label for="bairro">Bairro: </label>
    <input type="text" id="bairro" name="bairro" class="input02" required placeholder="Informe seu Bairro..." [(ngModel)]="bairro">

    <label for="cidade">Cidade: </label>
    <input type="text" id="cidade" name="cidade" class="input02" required placeholder="Informe sua Cidade..." [(ngModel)]="cidade">

    <label for="uf">UF: </label>
    <input type="text" id="uf" name="uf" class="input02" required placeholder="Informe seu Estado/UF..." [(ngModel)]="uf">

    <div id="div-btns">
      <button type="submit" id="btnAdd">Cadastrar Atleta</button>
      <button type="reset" id="btnLimpar"> Limpar Dados </button>
    </div>
  </form>
</div>
